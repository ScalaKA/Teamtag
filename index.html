<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Teamtag Buffet – Wer bringt was mit?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;1,500&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --cream: #f4f7fa;
    --sage: #2e7cc4;
    --sage-dark: #1a4f80;
    --mustard: #1a4f80;
    --charcoal: #1e2a33;
    --line: #d8e3ec;
    --card: #ffffff;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--cream);
    color: var(--charcoal);
    font-family: 'Work Sans', sans-serif;
    font-weight: 400;
    line-height: 1.5;
  }

  .wrap {
    max-width: 780px;
    margin: 0 auto;
    padding: 48px 24px 80px;
  }

  header {
    text-align: center;
    margin-bottom: 40px;
  }

  .eyebrow {
    font-size: 13px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--sage-dark);
    font-weight: 600;
    margin-bottom: 10px;
  }

  h1 {
    font-family: 'Work Sans', sans-serif;
    font-weight: 600;
    font-size: 36px;
    margin: 0 0 12px;
    color: var(--mustard);
  }

  header p {
    max-width: 460px;
    margin: 0 auto;
    color: #6b6559;
    font-size: 15px;
  }

  .config-warning {
    background: #fbeee4;
    border: 1px solid #e8c9a8;
    color: #7a4a24;
    padding: 14px 18px;
    border-radius: 10px;
    font-size: 13.5px;
    margin-bottom: 24px;
  }

  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 28px 28px 24px;
    box-shadow: 0 2px 10px rgba(58,55,51,0.05);
    margin-bottom: 20px;
  }

  .card h2 {
    font-family: 'Work Sans', sans-serif;
    font-weight: 600;
    font-size: 20px;
    margin: 0 0 18px;
    color: var(--mustard);
  }

  label {
    display: block;
    font-size: 12.5px;
    font-weight: 600;
    color: var(--sage-dark);
    text-transform: uppercase;
    letter-spacing: 0.05em;
    margin-bottom: 6px;
  }

  input, select {
    width: 100%;
    padding: 11px 13px;
    border: 1px solid var(--line);
    border-radius: 8px;
    font-family: 'Work Sans', sans-serif;
    font-size: 14.5px;
    color: var(--charcoal);
    background: #fff;
    margin-bottom: 16px;
  }

  input:focus, select:focus {
    outline: none;
    border-color: var(--sage);
  }

  .row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
  }

  @media (max-width: 520px) {
    .row { grid-template-columns: 1fr; }
  }

  button {
    width: 100%;
    background: var(--sage-dark);
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 13px;
    font-family: 'Work Sans', sans-serif;
    font-weight: 600;
    font-size: 15px;
    cursor: pointer;
    transition: background 0.15s;
  }

  button:hover { background: var(--sage); }
  button:disabled { opacity: 0.6; cursor: default; }

  .status {
    text-align: center;
    font-size: 13.5px;
    margin-top: 10px;
    min-height: 18px;
  }

  .status.ok { color: var(--sage-dark); }
  .status.err { color: #b0432c; }

  .board-title {
    font-family: 'Work Sans', sans-serif;
    font-weight: 600;
    font-size: 22px;
    margin: 44px 0 18px;
    text-align: center;
    color: var(--mustard);
  }

  .section {
    margin-bottom: 26px;
  }

  .section-head {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 12px;
  }

  .dot {
    width: 10px; height: 10px; border-radius: 50%;
    flex-shrink: 0;
  }

  .section-head h3 {
    font-size: 14px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    margin: 0;
    color: var(--charcoal);
  }

  .entries {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .entry {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 10px 14px;
    font-size: 14.5px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    box-shadow: 0 1px 2px rgba(58,55,51,0.04);
  }

  .entry .text {
    display: flex;
    align-items: baseline;
    gap: 6px;
    flex-wrap: wrap;
  }

  .entry .item { font-weight: 600; }
  .entry .name { color: #6b6559; }

  .entry .delete-btn {
    margin-left: 4px;
    background: none;
    border: none;
    color: #b0432c;
    font-size: 15px;
    font-weight: 600;
    line-height: 1;
    cursor: pointer;
    padding: 2px 4px;
    border-radius: 4px;
  }

  .entry .delete-btn:hover {
    background: #fbeae4;
  }

  .empty {
    color: #9a9484;
    font-size: 14px;
    font-style: italic;
  }

  .refresh-hint {
    text-align: center;
    font-size: 12.5px;
    color: #9a9484;
    margin-top: 30px;
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <img src="https://www.berufsschule-scala.ch/wp-content/uploads/scala-logo.svg"
         alt="Berufsschule Scala"
         style="height:44px;margin-bottom:22px;"
         onerror="this.style.display='none';">
    <h1>Wer bringt was mit?</h1>
    <p>Damit unser Buffet nicht aus fünf Schoggikuchen und keinem Salat besteht, trag hier ein, was du mitbringst.</p>
  </header>

  <div class="card">
    <h2>Eintragen</h2>
    <form id="entryForm">
      <div class="row">
        <div>
          <label for="name">Dein Name</label>
          <input type="text" id="name" placeholder="" required>
        </div>
        <div>
          <label for="category">Kategorie</label>
          <select id="category" required>
            <option value="" disabled selected>Wählen…</option>
            <option>Salat</option>
            <option>Snacks &amp; Fingerfood</option>
            <option>Dessert</option>
            <option>Getränke</option>
            <option>Sonstiges</option>
          </select>
        </div>
      </div>
      <div>
        <label for="item">Was bringst du mit?</label>
        <input type="text" id="item" placeholder="" required>
      </div>
      <button type="submit" id="submitBtn">Eintragen</button>
      <div class="status" id="status"></div>
    </form>
  </div>

  <div class="board-title">Bereits eingetragen</div>
  <div id="board"><p class="empty">Lade Einträge…</p></div>

  <div class="refresh-hint">Die Liste aktualisiert sich beim Öffnen der Seite. Neu laden zeigt neue Einträge von anderen.</div>

</div>

<script>
  // ─────────────────────────────────────────────────────────
  // Hier die URL deines Google Apps Script Web Apps eintragen
  // (siehe Einrichtungsanleitung im apps-script-backend.gs).
  // Ohne diese URL kann die Seite Einträge nicht speichern
  // oder laden.
  // ─────────────────────────────────────────────────────────
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwfdRUq7Urz6-741aPHJkABm-j8q4fW3zUfhLSnadA0QuxYsDgv0sA-OehjPl108NlRuw/exec";

  const CATEGORY_COLORS = {
    "Salat": "#a9cbe8",
    "Snacks & Fingerfood": "#7cb0dc",
    "Dessert": "#5495cf",
    "Getränke": "#3679b5",
    "Sonstiges": "#255c92"
  };
  const CATEGORY_ORDER = ["Salat", "Snacks & Fingerfood", "Dessert", "Getränke", "Sonstiges"];

  const form = document.getElementById('entryForm');
  const statusEl = document.getElementById('status');
  const submitBtn = document.getElementById('submitBtn');
  const board = document.getElementById('board');
  let currentEntries = [];

  function isConfigured() {
    return SCRIPT_URL && SCRIPT_URL.startsWith('http');
  }

  function renderBoard(entries) {
    board.innerHTML = '';
    CATEGORY_ORDER.forEach(cat => {
      const items = entries.filter(e => e.category === cat);
      const section = document.createElement('div');
      section.className = 'section';

      const head = document.createElement('div');
      head.className = 'section-head';
      head.innerHTML = `<span class="dot" style="background:${CATEGORY_COLORS[cat] || '#999'}"></span><h3>${cat}</h3>`;
      section.appendChild(head);

      const wrap = document.createElement('div');
      wrap.className = 'entries';

      if (items.length === 0) {
        const empty = document.createElement('div');
        empty.className = 'empty';
        empty.textContent = 'Noch nichts eingetragen.';
        wrap.appendChild(empty);
      } else {
        items.forEach(e => {
          const chip = document.createElement('div');
          chip.className = 'entry';
          chip.innerHTML = `<span class="text"><span class="item">${escapeHtml(e.item)}</span><span class="name">— ${escapeHtml(e.name)}</span></span>`;
          if (e.id) {
            const delBtn = document.createElement('button');
            delBtn.className = 'delete-btn';
            delBtn.type = 'button';
            delBtn.title = 'Eintrag löschen';
            delBtn.textContent = '✕';
            delBtn.addEventListener('click', () => deleteEntry(e.id));
            chip.appendChild(delBtn);
          }
          wrap.appendChild(chip);
        });
      }
      section.appendChild(wrap);
      board.appendChild(section);
    });
  }

  function escapeHtml(str) {
    const d = document.createElement('div');
    d.textContent = str;
    return d.innerHTML;
  }

  async function deleteEntry(id) {
    if (!confirm('Diesen Eintrag wirklich löschen?')) return;

    const backup = currentEntries;
    currentEntries = currentEntries.filter(e => e.id !== id);
    renderBoard(currentEntries);

    try {
      await fetch(SCRIPT_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain' },
        body: JSON.stringify({ action: 'delete', id })
      });
    } catch (err) {
      currentEntries = backup;
      renderBoard(currentEntries);
      alert('Löschen hat nicht geklappt. Bitte nochmals versuchen.');
    }
  }

  async function loadEntries() {
    if (!isConfigured()) {
      renderBoard([]);
      return;
    }
    try {
      const res = await fetch(SCRIPT_URL + '?t=' + Date.now(), { cache: 'no-store' });
      const data = await res.json();
      currentEntries = data.entries || [];
      renderBoard(currentEntries);
    } catch (err) {
      board.innerHTML = '<p class="empty">Liste konnte nicht geladen werden. Seite neu laden zum nochmal versuchen.</p>';
    }
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    if (!isConfigured()) {
      statusEl.textContent = 'Backend noch nicht eingerichtet.';
      statusEl.className = 'status err';
      return;
    }

    const name = document.getElementById('name').value.trim();
    const category = document.getElementById('category').value;
    const item = document.getElementById('item').value.trim();

    if (!name || !category || !item) return;

    submitBtn.disabled = true;
    statusEl.textContent = 'Wird gespeichert…';
    statusEl.className = 'status';

    try {
      const res = await fetch(SCRIPT_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain' },
        body: JSON.stringify({ name, category, item })
      });
      const result = await res.json();
      statusEl.textContent = 'Eingetragen — danke!';
      statusEl.className = 'status ok';
      currentEntries.push({ id: result.id || '', name, category, item });
      renderBoard(currentEntries);
      form.reset();
    } catch (err) {
      statusEl.textContent = 'Fehler beim Speichern. Bitte nochmals versuchen.';
      statusEl.className = 'status err';
    } finally {
      submitBtn.disabled = false;
    }
  });

  loadEntries();
</script>
</body>
</html>
